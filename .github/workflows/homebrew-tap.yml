name: Homebrew tap

# After a stable GitHub release is published, propose the matching formula
# update to raiseCatError/homebrew-tap as a pull request (reviewable; the
# tap's own CI installs and tests it). Never runs for prereleases, dev pushes
# or pull requests.
#
# Needs one secret, HOMEBREW_TAP_TOKEN: a fine-grained token limited to the
# raiseCatError/homebrew-tap repository with Contents and Pull requests write.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  formula:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Release facts
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Strict stable semver only: the value later reaches a URL and a sed expression.
          printf '%s' "$TAG" | grep -Eqx 'v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}' || { echo "Not a stable version tag."; exit 1; }
          version="${TAG#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL --retry 3 -o release.tar.gz "$url"
          sha256="$(sha256sum release.tar.gz | cut -d' ' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: raiseCatError/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Propose the formula update
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          URL: ${{ steps.release.outputs.url }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          formula=Formula/nmsh.rb
          if grep -q "^  url \"$URL\"$" "$formula"; then
            # A published archive is immutable: never re-point the same version at different bytes.
            grep -q "^  sha256 \"$SHA256\"$" "$formula" || { echo "The formula already names $URL with a different sha256. Publish a new patch release instead."; exit 1; }
            echo "Formula already at $VERSION."; exit 0
          fi
          sed -i -E "s|^  url \".*\"$|  url \"$URL\"|; s|^  sha256 \".*\"$|  sha256 \"$SHA256\"|" "$formula"
          git diff --stat
          branch="nmsh-$VERSION"
          git switch -c "$branch"
          git -c user.name=J -c user.email=315733358+raiseCatError@users.noreply.github.com commit -am "nmsh $VERSION"
          git push origin "$branch"
          gh pr create --title "nmsh $VERSION" --body "Release: https://github.com/raiseCatError/notMyShell/releases/tag/v$VERSION
          Archive: $URL
          sha256: $SHA256"
