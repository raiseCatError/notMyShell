name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    # Stacked PRs need the same gates as integration PRs.

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
        node-version: [22.x, 26.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Linux shell and native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh build-essential python3

      - name: Verify secure Linux system completion paths
        if: runner.os == 'Linux'
        run: |
          # Hosted image completion directories can be group-writable. Global
          # compinit then prompts before NMSh's isolated startup files run.
          insecure="$(zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null || true)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              /usr/share/zsh|/usr/share/zsh/*|/usr/local/share/zsh|/usr/local/share/zsh/*)
                sudo chown root:root "$path"
                sudo chmod go-w "$path"
                ;;
              *) echo "::error::Unexpected insecure completion path: $path"; exit 1 ;;
            esac
          done <<< "$insecure"
          zsh -fc 'autoload -Uz compaudit; compaudit'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck benchmark script
        run: npx tsc --ignoreConfig --noEmit --types node --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --skipLibCheck scripts/benchmarks.ts scripts/platform-benchmarks.ts scripts/idle-benchmarks.ts

      - name: Bounded platform timing smoke
        run: |
          node --import=tsx scripts/platform-benchmarks.ts
          NMSH_BENCH_SAMPLES=5 NMSH_BENCH_WARMUP=1 npm run bench -- completion/configured-cold completion/configured-warm composer/screen-plan transcript/wrap-present-10000

      - name: Run tests
        run: npm test -- --test-timeout=120000

      - name: Verify working tree clean
        run: git diff --check

      - name: Process leak check
        run: |
          if ps -axo pid,ppid,pgid,command | grep -E '[z]sh.*nmsh-semantic|[n]msh-semantic|[c]onfigured-completion\.zsh|[c]apture\.zsh|[v]iewportSyntax' | grep -v grep; then
            echo "::error::NMSh helper or test processes leaked!"
            exit 1
          fi
          echo "No processes leaked."
