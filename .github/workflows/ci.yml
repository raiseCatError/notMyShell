# Diagnostic branch only. NEVER MERGE.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  less-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: less --version && uname -a
      - run: python3 scripts/diagnostics/less-window.py "${{ runner.temp }}/less-window"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: less-window
          path: ${{ runner.temp }}/less-window
          retention-days: 30
