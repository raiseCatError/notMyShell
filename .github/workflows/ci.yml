name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANGED_FILES: ${{ runner.temp }}/nmsh-changed-files
        shell: bash
        run: |
          # Never path-skip the workflow: the final CI check must always exist.
          if [[ "$EVENT" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            git diff --check "$BASE" "$HEAD"
            git diff --no-renames --name-only -z "$BASE" "$HEAD" > "$CHANGED_FILES"
            python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path
          files = Path(os.environ['CHANGED_FILES']).read_bytes().split(b'\0')
          docs_only = all(filename.startswith(b'docs/') or filename.endswith(b'.md') for filename in files if filename)
          website_files = [filename for filename in files if filename.startswith(b'website/') or filename in (b'.github/workflows/website.yml', b'.github/workflows/website-deploy.yml')]
          website_only = bool(website_files) and all(filename in website_files or filename == b'README.md' for filename in files if filename)
          print('code=' + str(not (website_only or (os.environ['EVENT'] == 'pull_request' and docs_only))).lower())
          PYTHON
          fi

  quality:
    name: Quality (Node 26)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:bench
      - run: npm run test:fast
      - run: git diff --check

  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # Three shards per OS: test steps measured 4.9-6.6 minutes and whole jobs 6-7.8 minutes on 2026-10-22 (two shards had
    # reached 8-10 minutes against a 10-minute cap). The cap is about 1.5x the slowest job, so slow macOS runners pass and a
    # hang still fails the job; every test keeps its own 120 s timeout.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
      - uses: ./.github/actions/linux-shells
        if: runner.os == 'Linux'
      - run: npm ci
      # The Mermaid diagram tests use a real Mermaid. NMSh never downloads one; CI fetches the pinned release, checks its npm
      # integrity and keeps only the bundle (tests/diagramsChrome.test.ts reads NMSH_TEST_MERMAID).
      - name: Mermaid for the diagram tests
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mermaid"
          mkdir -p "$dir"
          npm pack mermaid@12.2.0 --pack-destination "$dir" --silent > /dev/null
          actual="sha512-$(openssl dgst -sha512 -binary "$dir/mermaid-12.2.0.tgz" | openssl base64 -A)"
          test "$actual" = "sha512-w7nr/SFrLO7BaVTs3dQTvYSV6nYSBj0Yy9DjBhsIJtAcHqRzXSq4Pg32ujHZ/AdWsAMNEvvhbm5dt9E2tOiHzw=="
          tar -xzf "$dir/mermaid-12.2.0.tgz" -C "$dir" package/package.json package/LICENSE package/dist/mermaid.min.js
          echo "NMSH_TEST_MERMAID=$dir/package" >> "$GITHUB_ENV"
      # Built-launcher tests must execute rather than silently skip on fresh runners.
      - run: npm run build
      - run: npm test -- --shard=${{ matrix.shard }}/3 --test-timeout=120000
      - name: Process leak check
        if: always()
        run: bash scripts/check-process-leaks.sh

  node22:
    name: Node 22 compatibility
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: ./.github/actions/linux-shells
      - run: npm ci
      - run: npm run build
      - run: npm run test:node22 -- --test-timeout=120000
      - name: Process leak check
        if: always()
        run: bash scripts/check-process-leaks.sh

  timings:
    name: Timing smoke (${{ matrix.os }}, Node 26)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
      - uses: ./.github/actions/linux-shells
        if: runner.os == 'Linux'
      - run: npm ci
      - run: npm run bench:smoke
      - name: Process leak check
        if: always()
        run: bash scripts/check-process-leaks.sh

  fedora:
    name: Linux portability subset (Fedora)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: fedora:42
    steps:
      - name: Install system prerequisites
        run: dnf install -y git zsh fish gcc-c++ make python3 which lsof procps-ng
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:fedora -- --test-timeout=120000
      - name: Process leak check
        if: always()
        run: bash scripts/check-process-leaks.sh

  status:
    name: CI
    if: always()
    needs: [changes, quality, tests, node22, timings, fedora]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          code = jobs['changes']['outputs'].get('code')
          required = ['changes']
          if code == 'true':
              required += ['quality', 'tests', 'node22']
          elif code != 'false':
              raise SystemExit('Missing change classification')
          if code == 'true' and '${{ github.event_name }}' != 'pull_request':
              required += ['timings', 'fedora']
          failed = [name for name in required if jobs[name]['result'] != 'success']
          if failed:
              raise SystemExit('Failed or skipped required gates: ' + ', '.join(failed))
          print('All applicable CI gates passed')
          PYTHON

  # Preserve the exact check names required by the existing master ruleset.
  required-checks:
    name: Verify (${{ matrix.node-version }})
    needs: status
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22.x, 26.x]
    steps:
      - name: Require aggregate CI success
        env:
          RESULT: ${{ needs.status.result }}
        run: test "$RESULT" = success
