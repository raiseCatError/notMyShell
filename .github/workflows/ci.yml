name: Diagnose input ownership 473
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bounded targeted read controls, two workers
        run: python3 _diagnostic/run-targeted.py
      - name: Same complete shard with scoped lifecycle trace
        if: always()
        run: npm test -- --shard=3/3 --test-timeout=120000 --import=./_diagnostic/trace-input-test.mjs > _diagnostic/full-shard.log 2>&1
      - name: Process leak check
        if: always()
        run: bash scripts/check-process-leaks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-ownership-473-diagnostic
          path: |
            _diagnostic/*.log
            _diagnostic/*.json
            _diagnostic/*.jsonl
          retention-days: 30
