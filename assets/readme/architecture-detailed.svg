<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="716" viewBox="0 0 1100 716" role="img" aria-label="NMSh detailed runtime flow"><title>NMSh detailed runtime flow</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#8b84b2"/></marker></defs><rect width="1100" height="716" rx="20" fill="#15141c"/><g font-family="ui-sans-serif,system-ui,sans-serif"><rect x="36" y="24" width="4" height="4" fill="#ac96e6"/><rect x="52" y="24" width="4" height="4" fill="#ac96e6"/><rect x="36" y="28" width="4" height="4" fill="#ac96e6"/><rect x="40" y="28" width="4" height="4" fill="#ac96e6"/><rect x="44" y="28" width="4" height="4" fill="#ac96e6"/><rect x="48" y="28" width="4" height="4" fill="#ac96e6"/><rect x="52" y="28" width="4" height="4" fill="#ac96e6"/><rect x="36" y="32" width="4" height="4" fill="#ac96e6"/><rect x="40" y="32" width="4" height="4" fill="#161220"/><rect x="44" y="32" width="4" height="4" fill="#ac96e6"/><rect x="48" y="32" width="4" height="4" fill="#161220"/><rect x="52" y="32" width="4" height="4" fill="#ac96e6"/><rect x="84" y="32" width="4" height="4" fill="#ac96e6"/><rect x="36" y="36" width="4" height="4" fill="#ac96e6"/><rect x="40" y="36" width="4" height="4" fill="#161220"/><rect x="44" y="36" width="4" height="4" fill="#ac96e6"/><rect x="48" y="36" width="4" height="4" fill="#161220"/><rect x="52" y="36" width="4" height="4" fill="#ac96e6"/><rect x="80" y="36" width="4" height="4" fill="#ac96e6"/><rect x="36" y="40" width="4" height="4" fill="#ac96e6"/><rect x="40" y="40" width="4" height="4" fill="#ac96e6"/><rect x="44" y="40" width="4" height="4" fill="#ac96e6"/><rect x="48" y="40" width="4" height="4" fill="#ac96e6"/><rect x="52" y="40" width="4" height="4" fill="#ac96e6"/><rect x="56" y="40" width="4" height="4" fill="#ac96e6"/><rect x="60" y="40" width="4" height="4" fill="#ac96e6"/><rect x="64" y="40" width="4" height="4" fill="#ac96e6"/><rect x="68" y="40" width="4" height="4" fill="#ac96e6"/><rect x="72" y="40" width="4" height="4" fill="#ac96e6"/><rect x="76" y="40" width="4" height="4" fill="#ac96e6"/><rect x="40" y="44" width="4" height="4" fill="#ac96e6"/><rect x="44" y="44" width="4" height="4" fill="#ac96e6"/><rect x="48" y="44" width="4" height="4" fill="#ac96e6"/><rect x="52" y="44" width="4" height="4" fill="#ac96e6"/><rect x="56" y="44" width="4" height="4" fill="#ac96e6"/><rect x="60" y="44" width="4" height="4" fill="#ac96e6"/><rect x="64" y="44" width="4" height="4" fill="#ac96e6"/><rect x="68" y="44" width="4" height="4" fill="#ac96e6"/><rect x="72" y="44" width="4" height="4" fill="#ac96e6"/><rect x="76" y="44" width="4" height="4" fill="#ac96e6"/><rect x="40" y="48" width="4" height="4" fill="#ac96e6"/><rect x="44" y="48" width="4" height="4" fill="#ac96e6"/><rect x="48" y="48" width="4" height="4" fill="#ac96e6"/><rect x="52" y="48" width="4" height="4" fill="#ac96e6"/><rect x="56" y="48" width="4" height="4" fill="#ac96e6"/><rect x="60" y="48" width="4" height="4" fill="#ac96e6"/><rect x="64" y="48" width="4" height="4" fill="#ac96e6"/><rect x="68" y="48" width="4" height="4" fill="#ac96e6"/><rect x="72" y="48" width="4" height="4" fill="#ac96e6"/><rect x="76" y="48" width="4" height="4" fill="#ac96e6"/><rect x="40" y="52" width="4" height="4" fill="#ac96e6"/><rect x="48" y="52" width="4" height="4" fill="#ac96e6"/><rect x="68" y="52" width="4" height="4" fill="#ac96e6"/><rect x="76" y="52" width="4" height="4" fill="#ac96e6"/><text x="103" y="50" fill="#c5b9e8" font-size="26">notMyShell</text><text x="32" y="87" fill="#b0b8c2" font-size="18">Runtime flow · one persistent shell, one geometry plan per frame</text><rect x="32" y="128" width="280" height="112" rx="14" fill="#1d202c" stroke="#555b70"/><text x="52" y="160" fill="#f2f0ec" font-size="20">Terminal host</text><text x="52" y="189" fill="#b0b8c2" font-size="15">Keys, mouse, resize → NMSh</text><text x="52" y="213" fill="#b0b8c2" font-size="15">← rendered cells / raw passthrough</text><rect x="366" y="128" width="340" height="112" rx="14" fill="#252139" stroke="#c5b9e8"/><text x="386" y="160" fill="#c5b9e8" font-size="17">NMSh editor &amp; command routing</text><text x="386" y="189" fill="#b0b8c2" font-size="15">Composer → lexical Highlighter</text><text x="386" y="213" fill="#b0b8c2" font-size="15">Slash actions or shell submission</text><rect x="760" y="128" width="310" height="112" rx="14" fill="#1d202c" stroke="#555b70"/><text x="780" y="160" fill="#f2f0ec" font-size="20">Detached helpers</text><text x="780" y="189" fill="#b0b8c2" font-size="15">Isolated SemanticService</text><text x="780" y="213" fill="#b0b8c2" font-size="15">Completion · optional understanding</text><path d="M312 182 L360 182" fill="none" stroke="#8b84b2" stroke-width="2"  marker-end="url(#arrow)"/><path d="M706 182 L754 182" fill="none" stroke="#8b84b2" stroke-width="2"  marker-end="url(#arrow)"/><rect x="366" y="294" width="340" height="134" rx="14" fill="#252139" stroke="#c5b9e8"/><text x="386" y="326" fill="#c5b9e8" font-size="20">ScreenPlan &amp; presentation</text><text x="386" y="355" fill="#b0b8c2" font-size="15">Shared geometry: render, cursor, hit test</text><text x="386" y="379" fill="#b0b8c2" font-size="15">OutputBuffer → FOLLOW / DETACHED</text><text x="386" y="403" fill="#b0b8c2" font-size="15">Clock → motion, Chroma, live status</text><path d="M536 240 L536 288" fill="none" stroke="#8b84b2" stroke-width="2"  marker-end="url(#arrow)"/><path d="M366 352 L172 352 L172 246" fill="none" stroke="#8b84b2" stroke-width="2"  marker-end="url(#arrow)"/><rect x="366" y="482" width="340" height="112" rx="14" fill="#1d202c" stroke="#555b70"/><text x="386" y="514" fill="#f2f0ec" font-size="20">SessionClient</text><text x="386" y="543" fill="#b0b8c2" font-size="15">Session service: detach / reattach</text><text x="386" y="567" fill="#b0b8c2" font-size="15">Or in-process session transport</text><path d="M712 216 L736 216 L736 538 L712 538" fill="none" stroke="#8b84b2" stroke-width="2"  marker-end="url(#arrow)"/><text x="746" y="399" fill="#b0b8c2" font-size="15">submit</text><path d="M510 482 L510 434" fill="none" stroke="#8b84b2" stroke-width="2"  marker-end="url(#arrow)"/><text x="525" y="461" fill="#b0b8c2" font-size="14">output + lifecycle markers</text><rect x="32" y="482" width="280" height="112" rx="14" fill="#1d202c" stroke="#555b70"/><text x="52" y="514" fill="#f2f0ec" font-size="20">Persistence</text><text x="52" y="543" fill="#b0b8c2" font-size="15">Session journal / archives</text><text x="52" y="567" fill="#b0b8c2" font-size="15">History · configuration · themes</text><path d="M366 545 L318 545" fill="none" stroke="#8b84b2" stroke-width="2"  marker-end="url(#arrow)"/><rect x="760" y="482" width="310" height="112" rx="14" fill="#1d202c" stroke="#555b70"/><text x="780" y="514" fill="#f2f0ec" font-size="17">ShellSession + ShellAdapter</text><text x="780" y="543" fill="#b0b8c2" font-size="15">One persistent PTY</text><text x="780" y="567" fill="#b0b8c2" font-size="15">zsh / Bash / Fish → CLI &amp; TUI</text><path d="M706 557 L754 557" fill="none" stroke="#8b84b2" stroke-width="2"  marker-end="url(#arrow)"/><path d="M915 482 L915 267 L172 267 L172 246" fill="none" stroke="#7fc4cc" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="770" y="289" fill="#7fc4cc" font-size="14">interactive raw passthrough</text><text x="32" y="647" fill="#b0b8c2" font-size="16">Raw PTY output keeps its colors. Semantic highlighting belongs to NMSh input and submitted commands.</text><text x="32" y="677" fill="#b0b8c2" font-size="16">Helpers never attach to the host controlling TTY. ScreenPlan controls PTY size as well as frontend layout.</text></g></svg>
