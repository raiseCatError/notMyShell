<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="title description">
<title id="title">NMSh detailed runtime flow</title><desc id="description">A vertical host, frontend, session transport and shell stack. Isolated helpers support the composer. Output and lifecycle markers return to the frontend. Interactive programs bypass frontend presentation through raw passthrough.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#7D8590"/></marker></defs>
<rect width="1000" height="940" fill="#0B0B0F"/>
<g font-family="ui-sans-serif, system-ui, sans-serif"><text x="24" y="32" font-size="18" fill="#F2F0EC" font-weight="600">NMSh / runtime flow</text><rect x="360" y="62" width="280" height="94" fill="#0B0B0F" stroke="#3D444D" stroke-width="2"/><text x="500" y="96" font-size="21" fill="#F2F0EC" text-anchor="middle" font-weight="600">Terminal host</text><text x="500" y="124" font-size="15" fill="#B0B8C2" text-anchor="middle">Keys · mouse · resize · display</text><path d="M500 156 L500 204" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#arrow)"/><rect x="268" y="210" width="464" height="342" fill="#1E1B2E" stroke="#C5B9E8" stroke-width="2"/><rect x="410" y="227" width="3" height="3" fill="#ac96e6"/><rect x="422" y="227" width="3" height="3" fill="#ac96e6"/><rect x="410" y="230" width="3" height="3" fill="#ac96e6"/><rect x="413" y="230" width="3" height="3" fill="#ac96e6"/><rect x="416" y="230" width="3" height="3" fill="#ac96e6"/><rect x="419" y="230" width="3" height="3" fill="#ac96e6"/><rect x="422" y="230" width="3" height="3" fill="#ac96e6"/><rect x="410" y="233" width="3" height="3" fill="#ac96e6"/><rect x="413" y="233" width="3" height="3" fill="#161220"/><rect x="416" y="233" width="3" height="3" fill="#ac96e6"/><rect x="419" y="233" width="3" height="3" fill="#161220"/><rect x="422" y="233" width="3" height="3" fill="#ac96e6"/><rect x="446" y="233" width="3" height="3" fill="#ac96e6"/><rect x="410" y="236" width="3" height="3" fill="#ac96e6"/><rect x="413" y="236" width="3" height="3" fill="#161220"/><rect x="416" y="236" width="3" height="3" fill="#ac96e6"/><rect x="419" y="236" width="3" height="3" fill="#161220"/><rect x="422" y="236" width="3" height="3" fill="#ac96e6"/><rect x="443" y="236" width="3" height="3" fill="#ac96e6"/><rect x="410" y="239" width="3" height="3" fill="#ac96e6"/><rect x="413" y="239" width="3" height="3" fill="#ac96e6"/><rect x="416" y="239" width="3" height="3" fill="#ac96e6"/><rect x="419" y="239" width="3" height="3" fill="#ac96e6"/><rect x="422" y="239" width="3" height="3" fill="#ac96e6"/><rect x="425" y="239" width="3" height="3" fill="#ac96e6"/><rect x="428" y="239" width="3" height="3" fill="#ac96e6"/><rect x="431" y="239" width="3" height="3" fill="#ac96e6"/><rect x="434" y="239" width="3" height="3" fill="#ac96e6"/><rect x="437" y="239" width="3" height="3" fill="#ac96e6"/><rect x="440" y="239" width="3" height="3" fill="#ac96e6"/><rect x="413" y="242" width="3" height="3" fill="#ac96e6"/><rect x="416" y="242" width="3" height="3" fill="#ac96e6"/><rect x="419" y="242" width="3" height="3" fill="#ac96e6"/><rect x="422" y="242" width="3" height="3" fill="#ac96e6"/><rect x="425" y="242" width="3" height="3" fill="#ac96e6"/><rect x="428" y="242" width="3" height="3" fill="#ac96e6"/><rect x="431" y="242" width="3" height="3" fill="#ac96e6"/><rect x="434" y="242" width="3" height="3" fill="#ac96e6"/><rect x="437" y="242" width="3" height="3" fill="#ac96e6"/><rect x="440" y="242" width="3" height="3" fill="#ac96e6"/><rect x="413" y="245" width="3" height="3" fill="#ac96e6"/><rect x="416" y="245" width="3" height="3" fill="#ac96e6"/><rect x="419" y="245" width="3" height="3" fill="#ac96e6"/><rect x="422" y="245" width="3" height="3" fill="#ac96e6"/><rect x="425" y="245" width="3" height="3" fill="#ac96e6"/><rect x="428" y="245" width="3" height="3" fill="#ac96e6"/><rect x="431" y="245" width="3" height="3" fill="#ac96e6"/><rect x="434" y="245" width="3" height="3" fill="#ac96e6"/><rect x="437" y="245" width="3" height="3" fill="#ac96e6"/><rect x="440" y="245" width="3" height="3" fill="#ac96e6"/><rect x="413" y="248" width="3" height="3" fill="#ac96e6"/><rect x="419" y="248" width="3" height="3" fill="#ac96e6"/><rect x="434" y="248" width="3" height="3" fill="#ac96e6"/><rect x="440" y="248" width="3" height="3" fill="#ac96e6"/><text x="468" y="259" font-size="26" fill="#C5B9E8" font-weight="600">notMyShell</text><text x="500" y="286" font-size="15" fill="#B0B8C2" text-anchor="middle">Owns editing and presentation</text><rect x="292" y="312" width="416" height="80" fill="#0B0B0F" stroke="#3D444D" stroke-width="2"/><text x="316" y="342" font-size="19" fill="#F2F0EC" font-weight="600">Composer &amp; command routing</text><text x="316" y="370" font-size="15" fill="#B0B8C2">Lexical Highlighter · slash actions · shell input</text><path d="M500 392 L500 438" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#arrow)"/><rect x="292" y="444" width="416" height="84" fill="#0B0B0F" stroke="#3D444D" stroke-width="2"/><text x="316" y="474" font-size="19" fill="#F2F0EC" font-weight="600">ScreenPlan &amp; presentation</text><text x="316" y="499" font-size="15" fill="#B0B8C2">Shared geometry · OutputBuffer · motion clock</text><text x="500" y="544" font-size="14" fill="#C5B9E8" text-anchor="middle">Prompt · Chroma · activity · FOLLOW / DETACHED</text><path d="M268 486 L244 486 L244 109 L354 109" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#arrow)"/><text x="86" y="186" font-size="14" fill="#B0B8C2">Rendered frame</text><rect x="768" y="312" width="208" height="128" fill="#0B0B0F" stroke="#3D444D" stroke-width="2"/><text x="786" y="342" font-size="18" fill="#F2F0EC" font-weight="600">Isolated helpers</text><text x="786" y="370" font-size="15" fill="#B0B8C2">SemanticService</text><text x="786" y="394" font-size="15" fill="#B0B8C2">Completion / local AI</text><text x="786" y="418" font-size="14" fill="#B0B8C2">Never the host TTY</text><path d="M708 352 L762 352" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#arrow)"/><path d="M708 378 L746 378 L746 654 L694 654" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#arrow)"/><text x="753" y="577" font-size="14" fill="#B0B8C2">Submit</text><rect x="312" y="608" width="376" height="96" fill="#0B0B0F" stroke="#3D444D" stroke-width="2"/><text x="500" y="643" font-size="21" fill="#F2F0EC" text-anchor="middle" font-weight="600">SessionClient</text><text x="500" y="671" font-size="15" fill="#B0B8C2" text-anchor="middle">Service or in-process transport</text><path d="M312 652 L250 652 L250 486 L286 486" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#arrow)"/><text x="76" y="574" font-size="14" fill="#B0B8C2">Output + markers</text><rect x="24" y="608" width="208" height="96" fill="#0B0B0F" stroke="#3D444D" stroke-width="2"/><text x="42" y="638" font-size="18" fill="#F2F0EC" font-weight="600">Persistence</text><text x="42" y="663" font-size="15" fill="#B0B8C2">Journal / archives</text><text x="42" y="687" font-size="14" fill="#B0B8C2">History / config / themes</text><path d="M312 680 L238 680" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 704 L500 760" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#arrow)"/><text x="519" y="738" font-size="14" fill="#B0B8C2">Input / output</text><rect x="312" y="766" width="376" height="112" fill="#0B0B0F" stroke="#3D444D" stroke-width="2"/><text x="500" y="799" font-size="21" fill="#F2F0EC" text-anchor="middle" font-weight="600">ShellSession + ShellAdapter</text><text x="500" y="828" font-size="16" fill="#B0B8C2" text-anchor="middle">Persistent PTY · zsh / Bash / Fish</text><text x="500" y="855" font-size="15" fill="#B0B8C2" text-anchor="middle">CLI commands / interactive programs</text><path d="M688 820 L988 820 L988 50 L654 50 L654 109 L646 109" fill="none" stroke="#7D8590" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="772" y="782" font-size="15" fill="#B0B8C2">Raw passthrough</text><text x="500" y="915" font-size="14" fill="#B0B8C2" text-anchor="middle">Raw output keeps its colors. Semantic colors belong to NMSh input and submitted commands.</text></g>
</svg>
