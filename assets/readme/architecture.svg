<svg xmlns="http://www.w3.org/2000/svg" width="640" height="568" viewBox="0 0 640 568" role="img" aria-labelledby="title description">
<title id="title">NMSh: terminal host, frontend, real shell</title><desc id="description">The terminal host sends input to NMSh. NMSh owns editing and presentation over a persistent zsh, Bash or Fish PTY. Fullscreen applications pass through to the host.</desc>
