<svg width="800" height="40" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40">
  <defs>
    <style>
      .line { stroke: #333333; stroke-width: 1; }
      .chev { stroke: #8B84B2; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      @media (prefers-color-scheme: dark) {
        .line { stroke: #3D444D; }
        .chev { stroke: #C5B9E8; }
      }
    </style>
  </defs>
  <!-- Left line -->
  <line x1="100" y1="20" x2="385" y2="20" class="line" />
  
  <!-- Center chevron -->
  <path d="M 395 15 L 400 20 L 395 25" class="chev" />
  
  <!-- Right line -->
  <line x1="415" y1="20" x2="700" y2="20" class="line" />
</svg>
